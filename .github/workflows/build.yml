name: Build Dashboard Data

on:
  schedule:
    - cron: '30 21 * * 1-5' # 9:30 PM America/Toronto, Mon-Fri (DST-aware via timezone field)
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data
        run: python scripts/build_data.py --out-dir data --csv-url "${{ secrets.CSV_URL }}"
        env:
          INDUSTRIES_CSV_URL: ${{ secrets.INDUSTRIES_CSV_URL }}

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "refresh data"
          git pull --rebase origin main
          git push
