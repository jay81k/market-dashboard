name: Build Fundamentals Data

on:
  schedule:
    - cron: '0 21 * * 5'  # 9 PM UTC = 5 PM EDT every Friday
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DIAGNOSTIC - inspect raw HTML around quote-header_categories
        run: |
          cat > /tmp/diag.py << 'PYEOF'
          from curl_cffi import requests as curl_requests
          import finvizfinance.util as _futil

          sess = curl_requests.Session(impersonate='chrome110')
          _futil.session = sess

          r = sess.get(
              "https://finviz.com/quote.ashx?t=AAPL",
              headers=_futil.headers,
              timeout=_futil.timeout_value,
              proxies=_futil.proxy_dict,
          )
          html = r.text

          print("Status:", r.status_code)
          print("HTML length:", len(html))
          for needle in ["quote-header_categories", "quote-header_ticker-wrapper_company", "snapshot-table2"]:
              print(needle, "->", "FOUND" if needle in html else "MISSING")

          idx = html.find("quote-header_ticker-wrapper_company")
          if idx != -1:
              print()
              print("--- Context around company header (1500 chars) ---")
              print(html[idx:idx + 1500])
          else:
              print("Company header class not found at all in this HTML.")
          PYEOF
          python3 /tmp/diag.py

      - name: Build fundamentals data
        run: python scripts/fetch_fundamentals.py --snapshot-path data/snapshot.json --out-dir data

      - name: Commit and push fundamentals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json data/snapshot.json
          git diff --staged --quiet || git commit -m "refresh fundamentals and snapshot"
          git pull --rebase origin ${{ github.ref_name }}
          git push
