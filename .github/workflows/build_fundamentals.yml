name: Build Fundamentals Data

on:
  schedule:
    - cron: '0 21 * * 5'  # 9 PM UTC = 5 PM EDT every Friday
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DIAGNOSTIC - run actual patched library call on this runner
        run: |
          pip show finvizfinance
          python3 -c "
          from curl_cffi import requests as curl_requests
          import finvizfinance.util as _futil
          _futil.session = curl_requests.Session(impersonate='chrome110')
          from finvizfinance.quote import finvizfinance
          stock = finvizfinance('AAPL')
          f = stock.ticker_fundament()
          print('RESULT:', f.get('EPS this Y'))
          "

      - name: Build fundamentals data
        run: python scripts/fetch_fundamentals.py --snapshot-path data/snapshot.json --out-dir data

      - name: Commit and push fundamentals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json data/snapshot.json
          git diff --staged --quiet || git commit -m "refresh fundamentals and snapshot"
          git pull --rebase origin ${{ github.ref_name }}
          git push
